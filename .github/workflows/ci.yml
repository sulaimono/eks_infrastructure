
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false


jobs:
  security-checks:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0              # full history, so the secret scan sees every commit
          persist-credentials: false  # don't leave the GitHub token on disk

      - name: Scan for gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false   # don't try to comment on the PR (would need write access)

      - name: scan for vulnerability
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-ref: '.'
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  build:
    runs-on: ubuntu-latest
    needs: security-checks

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ vars.REGION }}
          role-to-assume: ${{ vars.IAM_ROLE }}

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1
        with:
          terraform_version: "1.16.6"

          #terraform fmt
      - name: Terraform Fmt
        run: terraform fmt -check -recursive

      - name: Write the terraform tvars
        env:
          TFVARS: ${{ secrets.TFVARS }}
        run: printf '%s\n' "$TFVARS" > terraform.tfvars

      - name: Initializing Terraform
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      # Pull request stops at plan and only main and manual run will apply
      - name: Terraform apply
        if: github.event_name != 'pull_request'
        run: terraform apply -input=false --auto-approve tfplan
